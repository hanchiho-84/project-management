<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GanttPro — 多專案管理</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f0f2f5; --surface:#fff; --surface2:#f8f9fb;
  --border:#e2e8f0; --text:#1e293b; --text2:#64748b;
  --primary:#3b82f6; --primary-d:#2563eb;
  --critical:#ef4444; --warning:#f59e0b; --success:#10b981;
  --shadow:0 1px 3px rgba(0,0,0,.1); --shadow-md:0 4px 12px rgba(0,0,0,.12);
  --row:44px; --hdr:56px; --lw:280px; --nav:60px;
}
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
body.dragging { user-select:none; cursor:grabbing !important; }
body.dragging * { cursor:inherit !important; }
body.connecting { cursor:crosshair !important; }
body.connecting * { cursor:inherit !important; }

/* ── Toolbar ── */
#tb { background:var(--surface); border-bottom:1px solid var(--border); padding:0 14px; height:52px; display:flex; align-items:center; gap:7px; flex-shrink:0; box-shadow:var(--shadow); z-index:10; }
.apt { font-size:15px; font-weight:700; color:var(--primary); margin-right:8px; display:flex; align-items:center; gap:6px; }
.btn { padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13px; cursor:pointer; display:flex; align-items:center; gap:5px; transition:all .15s; white-space:nowrap; }
.btn:hover { background:var(--bg); border-color:var(--primary); color:var(--primary); }
.btn.pri { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn.pri:hover { background:var(--primary-d); border-color:var(--primary-d); color:#fff; }
.btn.act { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn.act:hover { background:var(--primary-d); }
.sep { width:1px; height:24px; background:var(--border); margin:0 1px; flex-shrink:0; }
.sp { flex:1; }
.vsel { display:flex; gap:2px; background:var(--bg); border-radius:6px; padding:2px; border:1px solid var(--border); }
.vbtn { padding:4px 10px; border-radius:4px; font-size:12px; cursor:pointer; border:none; background:transparent; color:var(--text2); transition:all .15s; }
.vbtn.act { background:#fff; color:var(--text); box-shadow:var(--shadow); }

/* ── Side nav ── */
#app-body { display:flex; flex:1; overflow:hidden; }
#sidenav { width:var(--nav); background:#1e293b; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; flex-shrink:0; }
.nitem { width:48px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 4px; border:none; background:transparent; color:#94a3b8; cursor:pointer; border-radius:8px; font-size:10px; transition:all .15s; }
.nitem:hover { background:rgba(255,255,255,.08); color:#e2e8f0; }
.nitem.act { background:rgba(59,130,246,.25); color:#60a5fa; }
.nitem svg { flex-shrink:0; }
.ndivider { width:32px; height:1px; background:rgba(255,255,255,.1); margin:4px 0; }

/* ── Pages ── */
#page-gantt { display:flex; flex:1; overflow:hidden; }
#page-stats { display:none; flex:1; overflow:auto; padding:28px; flex-direction:column; gap:24px; background:var(--bg); }

/* ── Gantt layout ── */
#tpanel { width:var(--lw); background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
#tphdr { height:var(--hdr); border-bottom:1px solid var(--border); background:var(--surface2); display:flex; align-items:flex-end; padding:0 12px 10px; font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.06em; flex-shrink:0; }
#tbscroll { flex:1; overflow-y:auto; overflow-x:hidden; }
.trow { height:var(--row); display:flex; align-items:center; padding:0 6px 0 0; border-bottom:1px solid var(--border); cursor:pointer; gap:3px; transition:background .1s; }
.trow:hover { background:#f1f5f9; }
.trow.sel { background:#eff6ff; }
.trow.cr { border-left:3px solid var(--critical); }
.trow.wr { border-left:3px solid var(--warning); }
.trow.ov { border-left:3px solid var(--critical); }
.trow.drop-above { box-shadow:inset 0 3px 0 #3b82f6; }
.trow.drop-below { box-shadow:inset 0 -3px 0 #3b82f6; }
.trow.drop-into  { background:rgba(59,130,246,.1)!important; outline:2px dashed #60a5fa; outline-offset:-2px; border-radius:3px; }
.trow.dragging   { opacity:.35; pointer-events:none; }
.trow.proj { font-weight:700; background:var(--surface2); border-bottom:1px solid var(--border); }
.trow.proj:hover { background:#f1f5f9; }
.trow.goal { font-weight:800; background:#faf5ff; border-bottom:2px solid #c4b5fd; }
.trow.goal:hover { background:#f3e8ff; }
.tn.gname { font-size:14px; font-weight:800; }
.tn { flex:1; font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tn.pname { font-size:13px; font-weight:700; }
.tpct { font-size:11px; color:var(--text2); flex-shrink:0; }
.tstatus { font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; flex-shrink:0; white-space:nowrap; }
.tstatus.ts-done  { background:#d1fae5; color:#065f46; }
.tstatus.ts-over  { background:#fee2e2; color:#991b1b; }
.tstatus.ts-warn  { background:#fef3c7; color:#92400e; }
.tstatus.ts-ahead { background:#ccfbf1; color:#0f766e; }
.tstatus.ts-ok    { background:#dbeafe; color:#1e40af; }
.tacts { display:none; gap:2px; }
.trow:hover .tacts { display:flex; }
.ibtn { width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:4px; border:none; background:transparent; cursor:pointer; color:var(--text2); font-size:13px; }
.ibtn:hover { background:var(--border); }
.ibtn.del:hover { background:#fee2e2; color:var(--critical); }
.tog { width:18px; height:18px; display:flex; align-items:center; justify-content:center; border:none; background:transparent; cursor:pointer; color:var(--text2); font-size:10px; flex-shrink:0; border-radius:3px; }
.tog:hover { background:var(--border); }
.assignee { font-size:11px; color:var(--text2); background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:1px 7px; white-space:nowrap; flex-shrink:0; }

/* ── Gantt chart ── */
#gw { flex:1; display:flex; flex-direction:column; overflow:hidden; }
#thouter { height:var(--hdr); overflow:hidden; flex-shrink:0; border-bottom:2px solid var(--border); background:var(--surface2); }
#thsvg { display:block; }
#gbscroll { flex:1; overflow:auto; }
#gsvg { display:block; }

/* ── Stats page ── */
.stats-section-title { font-size:13px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; }
.stats-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:24px; }
.stat-card { background:var(--surface); border-radius:10px; padding:18px 20px; box-shadow:var(--shadow); border:1px solid var(--border); }
.stat-card-val { font-size:28px; font-weight:800; line-height:1; margin-bottom:4px; }
.stat-card-lbl { font-size:12px; color:var(--text2); }
.people-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
.person-card { background:var(--surface); border-radius:10px; padding:20px; box-shadow:var(--shadow); border:1px solid var(--border); }
.person-header { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.avatar { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:#fff; flex-shrink:0; }
.person-name { font-size:15px; font-weight:700; }
.person-role { font-size:12px; color:var(--text2); margin-top:1px; }
.prog-bar-wrap { background:#e2e8f0; border-radius:99px; height:8px; margin:8px 0 4px; overflow:hidden; }
.prog-bar-fill { height:100%; border-radius:99px; transition:width .4s; }
.prog-label { display:flex; justify-content:space-between; font-size:12px; color:var(--text2); }
.task-pills { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.pill { padding:3px 10px; border-radius:99px; font-size:11px; font-weight:600; }
.pill.done  { background:#d1fae5; color:#065f46; }
.pill.prog  { background:#dbeafe; color:#1e40af; }
.pill.warn  { background:#fef3c7; color:#92400e; }
.pill.over  { background:#fee2e2; color:#991b1b; }
.pill.ahead { background:#ccfbf1; color:#0f766e; }
.person-tasks { margin-top:14px; border-top:1px solid var(--border); padding-top:12px; display:flex; flex-direction:column; gap:6px; }
.ptask { display:flex; align-items:center; gap:8px; font-size:12px; }
.ptask-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.ptask-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.ptask-pct { color:var(--text2); flex-shrink:0; }
.proj-stat-row { background:var(--surface); border-radius:10px; padding:16px 20px; box-shadow:var(--shadow); border:1px solid var(--border); display:flex; align-items:center; gap:14px; }
.proj-stat-name { font-size:13px; font-weight:700; width:130px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.proj-stat-bar-wrap { flex:1; background:#e2e8f0; border-radius:99px; height:10px; overflow:hidden; }
.proj-stat-bar { height:100%; border-radius:99px; transition:width .4s; }
.proj-stat-pct { font-size:13px; font-weight:700; width:38px; text-align:right; flex-shrink:0; }
.proj-stat-count { font-size:11px; color:var(--text2); width:60px; flex-shrink:0; }

/* ── Workload section ── */
.workload-row { background:var(--surface); border-radius:10px; padding:18px 20px; box-shadow:var(--shadow); border:1px solid var(--border); }
.workload-header { display:flex; align-items:center; gap:14px; margin-bottom:10px; }
.workload-meta { flex:1; min-width:0; }
.workload-name { font-size:14px; font-weight:700; margin-bottom:6px; display:flex; justify-content:space-between; align-items:baseline; }
.workload-bar-track { background:#e2e8f0; border-radius:99px; height:12px; overflow:hidden; display:flex; }
.workload-chips { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
.wchip { display:flex; align-items:center; gap:5px; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:3px 9px; font-size:11px; white-space:nowrap; }

/* ── Overdue page ── */
#page-overdue { display:none; flex:1; overflow:auto; padding:28px; flex-direction:column; gap:20px; background:var(--bg); }
.overdue-empty { background:var(--surface); border-radius:10px; padding:40px; text-align:center; box-shadow:var(--shadow); border:1px solid var(--border); color:var(--success); font-size:15px; font-weight:600; }
.overdue-card { background:var(--surface); border-radius:10px; padding:20px; box-shadow:var(--shadow); border:1px solid var(--border); border-left:4px solid var(--critical); }
.overdue-card-hdr { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.overdue-card-info { flex:1; min-width:0; }
.overdue-card-name { font-size:15px; font-weight:700; }
.overdue-card-email { font-size:12px; color:var(--text2); margin-top:2px; }
.overdue-task-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.overdue-task-row:last-child { border-bottom:none; padding-bottom:0; }
.overdue-task-name { flex:1; font-weight:500; }
.overdue-task-meta { font-size:11px; color:var(--text2); white-space:nowrap; }
.days-late { background:#fee2e2; color:#991b1b; font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px; white-space:nowrap; flex-shrink:0; }
.prog-inline { font-size:11px; color:var(--text2); white-space:nowrap; flex-shrink:0; }
.send-btn { display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:7px; border:1px solid var(--critical); background:#fff; color:#991b1b; font-size:13px; font-weight:600; cursor:pointer; transition:all .15s; flex-shrink:0; }
.send-btn:hover { background:#fee2e2; }
.send-btn.sent { border-color:#10b981; color:#065f46; }
.send-btn.sent:hover { background:#d1fae5; }

/* ── Team page ── */
#page-team { display:none; flex:1; overflow:auto; padding:28px; flex-direction:column; gap:24px; background:var(--bg); }
.team-toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.team-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px; }
.member-card { background:var(--surface); border-radius:10px; padding:20px; box-shadow:var(--shadow); border:1px solid var(--border); display:flex; align-items:center; gap:14px; transition:box-shadow .15s; }
.member-card:hover { box-shadow:var(--shadow-md); }
.member-info { flex:1; min-width:0; }
.member-name { font-size:15px; font-weight:700; }
.member-email { font-size:12px; color:var(--text2); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.member-line { display:inline-block; margin-top:8px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:2px 10px; font-size:11px; color:var(--text2); }
.member-acts { display:flex; gap:6px; flex-shrink:0; }

/* ── Modal ── */
.ov2 { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(2px); }
.modal { background:#fff; border-radius:12px; padding:24px; width:500px; max-width:94vw; box-shadow:0 20px 50px rgba(0,0,0,.25); }
.mttl { font-size:17px; font-weight:700; margin-bottom:18px; }
.fg { margin-bottom:14px; }
.fl { display:block; font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.05em; margin-bottom:5px; }
.fi { width:100%; padding:8px 11px; border:1px solid var(--border); border-radius:6px; font-size:14px; color:var(--text); outline:none; transition:border-color .15s; background:#fff; }
.fi:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,130,246,.1); }
.fr { display:flex; gap:10px; }
.fr .fg { flex:1; }
.mact { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
.type-seg { display:flex; gap:2px; background:var(--bg); border-radius:7px; padding:3px; border:1px solid var(--border); }
.type-opt { padding:5px 14px; border-radius:5px; font-size:13px; cursor:pointer; border:none; background:transparent; color:var(--text2); transition:all .15s; }
.type-opt.act { background:#fff; color:var(--text); font-weight:600; box-shadow:var(--shadow); }

/* ── Legend ── */
#leg { position:fixed; bottom:14px; right:14px; background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:11px; box-shadow:var(--shadow-md); display:flex; gap:12px; align-items:center; z-index:50; }
.li { display:flex; align-items:center; gap:4px; }
.ld { width:10px; height:10px; border-radius:3px; }

/* ── Status bar ── */
#sbar { height:32px; background:var(--surface); border-top:1px solid var(--border); display:flex; align-items:center; padding:0 16px; gap:20px; font-size:12px; color:var(--text2); flex-shrink:0; }
.si { display:flex; align-items:center; gap:5px; }
.sd { width:8px; height:8px; border-radius:50%; }

/* ── Misc ── */
#tt { position:fixed; background:#1e293b; color:#fff; padding:9px 13px; border-radius:7px; font-size:12px; pointer-events:none; z-index:200; display:none; max-width:230px; line-height:1.6; box-shadow:0 4px 16px rgba(0,0,0,.35); }
#drag-hint { position:fixed; bottom:50px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:6px 14px; border-radius:20px; font-size:12px; pointer-events:none; z-index:300; display:none; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:#94a3b8; }
</style>
</head>

function setLang(l){
  lang=l;
  const t=T[l];
  const isEn=l==='en';
  // Toggle button label
  const btn=document.getElementById('btn-lang');
  if(btn)btn.textContent=isEn?'中文':'EN';
  // html lang attr
  document.documentElement.lang=isEn?'en':'zh-TW';
  // Toolbar
  const ag=document.getElementById('btn-add-goal');if(ag)ag.innerHTML=t.addGoal;
  const ap=document.getElementById('btn-add-project');if(ap)ap.innerHTML=t.addProject;
  const at=document.getElementById('btn-add-task');if(at)at.innerHTML=t.addTask;
  const lcp=document.getElementById('lbl-cp');if(lcp)lcp.textContent=t.cp;
  const lbl=document.getElementById('lbl-bl');if(lbl)lbl.textContent=t.bl;
  const lsbl=document.getElementById('lbl-save-bl');if(lsbl)lsbl.textContent=t.saveBl;
  ['day','week','month'].forEach(v=>{const b=document.getElementById('v'+v[0]);if(b)b.setAttribute('data-i18n',v);});
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(t[k])el.textContent=t[k];});
  const wp=document.getElementById('lbl-warn-prefix');if(wp)wp.textContent=t.warnPrefix;
  const ws=document.getElementById('lbl-warn-suffix');if(ws)ws.textContent=t.warnSuffix;
  const td=document.getElementById('lbl-today');if(td)td.textContent=t.today;
  const ex=document.getElementById('lbl-export');if(ex)ex.textContent=t.export;
  const im=document.getElementById('lbl-import');if(im)im.textContent=t.import;
  // Nav
  const ng=document.getElementById('nav-lbl-gantt');if(ng)ng.textContent=t.navGantt;
  const ns=document.getElementById('nav-lbl-stats');if(ns)ns.textContent=t.navStats;
  const nt=document.getElementById('nav-lbl-team');if(nt)nt.textContent=t.navTeam;
  const no=document.getElementById('nav-lbl-overdue');if(no)no.textContent=t.navOverdue;
  // Panel header
  const ct=document.getElementById('lbl-col-task');if(ct)ct.textContent=t.colTask;
  const cp2=document.getElementById('lbl-col-prog');if(cp2)cp2.textContent=t.colProg;
  // Team toolbar
  const tm=document.getElementById('lbl-team-members');if(tm)tm.textContent=t.teamMembers;
  const am=document.getElementById('lbl-add-member');if(am)am.textContent=t.addMember;
  // Status bar hint
  const sh=document.getElementById('sbar-hint');if(sh)sh.textContent=t.sbarHint;
  // Legend
  const ln=document.getElementById('leg-normal');if(ln)ln.textContent=t.legNormal;
  const lc=document.getElementById('leg-cp');if(lc)lc.textContent=t.legCp;
  const lw=document.getElementById('leg-warn');if(lw)lw.textContent=t.legWarn;
  const lo=document.getElementById('leg-over');if(lo)lo.textContent=t.legOver;
  const ld=document.getElementById('leg-done');if(ld)ld.textContent=t.legDone;
  const lb=document.getElementById('leg-bl');if(lb)lb.textContent=t.legBl;
  // Modal labels
  const mty=document.getElementById('lbl-type');if(mty)mty.textContent=t.modalType;
  const tg=document.getElementById('lbl-tp-goal');if(tg)tg.textContent=t.tpGoal;
  const tpr=document.getElementById('lbl-tp-project');if(tpr)tpr.textContent=t.tpProject;
  const ttask=document.getElementById('lbl-tp-task');if(ttask)ttask.textContent=t.tpTask;
  const tms=document.getElementById('lbl-tp-milestone');if(tms)tms.textContent=t.tpMilestone;
  const mn=document.getElementById('lbl-name');if(mn)mn.textContent=t.name;
  const ma=document.getElementById('lbl-assignee');if(ma)ma.textContent=t.assignee;
  const msd=document.getElementById('lbl-start');if(msd)msd.textContent=t.startDate;
  const med=document.getElementById('lbl-end');if(med)med.textContent=t.endDate;
  const mdr=document.getElementById('lbl-dur');if(mdr)mdr.textContent=t.dur;
  const mpg=document.getElementById('lbl-prog');if(mpg){const pv=document.getElementById('pv');mpg.innerHTML=t.prog.replace('%',` <span id="pv">${pv?pv.textContent:'0'}</span>%`);}
  const mdep=document.getElementById('lbl-deps');if(mdep)mdep.textContent=t.deps;
  const mca=document.getElementById('lbl-modal-cancel');if(mca)mca.textContent=t.cancel;
  const msv=document.getElementById('lbl-modal-save');if(msv)msv.textContent=t.save;
  // Member modal labels
  const mmn=document.getElementById('lbl-mm-name');if(mmn)mmn.textContent=t.mmName;

  const mmca=document.getElementById('lbl-mm-cancel');if(mmca)mmca.textContent=t.cancel;
  const mmsv=document.getElementById('lbl-mm-save');if(mmsv)mmsv.textContent=t.save;
  // Re-render dynamic content if pages are visible
  if(typeof render==='function')render();
  const cp3=document.getElementById('page-stats');
  if(cp3&&cp3.style.display!=='none'&&typeof renderStatsPage==='function')renderStatsPage();
  const tp=document.getElementById('page-team');
  if(tp&&tp.style.display!=='none'&&typeof renderTeamPage==='function')renderTeamPage();
  const op=document.getElementById('page-overdue');
  if(op&&op.style.display!=='none'&&typeof renderOverduePage==='function')renderOverduePage();
}

const fmtD=d=>{const y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return`${y}-${mo}-${da}`;};

// ── Tree helpers ──────────────────────────────────────────────────────
const isLeaf=t=>t.type!=='project'&&t.type!=='goal';
const getChildren=id=>tasks.filter(t=>t.parentId===id);
function getLeafDescendants(id){
  const res=[];
  tasks.filter(t=>t.parentId===id).forEach(t=>{if(isLeaf(t))res.push(t);else res.push(...getLeafDescendants(t.id));});
  return res;
}
function getProjectBounds(id){
  const leaves=getLeafDescendants(id).filter(t=>t.start);
  if(!leaves.length)return null;
  const sts=leaves.map(t=>parseD(t.start).getTime()),ens=leaves.map(t=>addDays(parseD(t.start),t.dur).getTime());
  const mn=new Date(Math.min(...sts)),mx=new Date(Math.max(...ens));
  return{start:mn,end:mx,dur:Math.max(diff(mn,mx),1)};
}
function getProjectProgress(id){
  const l=getLeafDescendants(id);return l.length?Math.round(l.reduce((s,t)=>s+t.prog,0)/l.length):0;
}
function getVisibleRows(){
  const rows=[];
  function add(t,level){
    rows.push({task:t,level});
    if(t.type==='goal'&&!collapsed.has(t.id)){
      getChildren(t.id).filter(c=>!filterAssignee||c.assignee===filterAssignee).forEach(c=>add(c,level+1));
    } else if(t.type==='project'&&!collapsed.has(t.id)){
      getChildren(t.id).forEach(c=>add(c,level+1));
    }
  }
  tasks.filter(t=>!t.parentId).forEach(t=>{
    if(t.type==='goal'){
      if(!filterAssignee||getChildren(t.id).some(c=>c.assignee===filterAssignee))add(t,0);
    } else {
      if(!filterAssignee||t.assignee===filterAssignee)add(t,0);
    }
  });
  return rows;
}

// ── CPM ───────────────────────────────────────────────────────────────
function cpm(){
  const leaves=tasks.filter(isLeaf);
  const m={};leaves.forEach(t=>{m[t.id]={...t,es:0,ef:0,ls:0,lf:0,fl:0};});
  const vis=new Set(),ord=[];
  const visit=id=>{if(vis.has(id))return;vis.add(id);(m[id]?.deps||[]).forEach(d=>{if(m[d])visit(d);});if(m[id])ord.push(id);};
  leaves.forEach(t=>visit(t.id));
  ord.forEach(id=>{const t=m[id];if(!t)return;const vd=t.deps.filter(d=>m[d]);t.es=vd.length?Math.max(...vd.map(d=>m[d].ef)):0;t.ef=t.es+t.dur;});
  const pe=Math.max(0,...Object.values(m).map(t=>t.ef));
  [...ord].reverse().forEach(id=>{const t=m[id];if(!t)return;const sc=leaves.filter(s=>s.deps.includes(t.id));t.lf=sc.length?Math.min(...sc.map(s=>m[s.id]?.ls??pe)):pe;t.ls=t.lf-t.dur;t.fl=t.ls-t.es;});
  return{crit:new Set(Object.values(m).filter(t=>t.fl<=0).map(t=>t.id))};
}

// ── Status ────────────────────────────────────────────────────────────
function status(t){
  if(t.type==='goal'||t.type==='project'){const ss=getLeafDescendants(t.id).map(l=>status(l));if(!ss.length)return'ok';if(ss.every(s=>s==='done'))return'done';if(ss.some(s=>s==='over'))return'over';if(ss.some(s=>s==='warn'))return'warn';if(ss.some(s=>s==='ahead'))return'ahead';return'ok';}
  const wd=parseInt(document.getElementById('wdays').value)||3;
  const dl=diff(tod(),addDays(parseD(t.start),t.dur));
  if(t.prog>=100)return'done';if(dl<0)return'over';if(dl<=wd)return'warn';
  const elapsed=diff(parseD(t.start),tod());
  if(elapsed>0){const exp=Math.min(100,elapsed/t.dur*100);if(t.prog>=exp+15)return'ahead';}
  return'ok';
}
function barCol(t,isCrit){
  if(t.type==='project')return t.color;
  const s=status(t);if(s==='done')return'#10b981';if(s==='over')return'#dc2626';if(s==='warn')return'#f59e0b';
  if(isCrit&&showCP)return'#ef4444';return t.color;
}

// ── Date range ────────────────────────────────────────────────────────
function dateRange(){
  const leaves=tasks.filter(isLeaf).filter(t=>t.start);
  if(!leaves.length){const t=tod();return{mn:addDays(t,-7),mx:addDays(t,60)};}
  const sts=leaves.map(t=>parseD(t.start).getTime()),ens=leaves.map(t=>addDays(parseD(t.start),t.dur).getTime());
  let mn=new Date(Math.min(...sts)),mx=new Date(Math.max(...ens));
  while(mn.getDay()!==1)mn=addDays(mn,-1);
  mn=addDays(mn,-7);mx=addDays(mx,14);return{mn,mx};
}

function statusPill(st){
  const map={done:['ts-done',T[lang].stDone],over:['ts-over',T[lang].stOver],warn:['ts-warn',T[lang].stWarn],ahead:['ts-ahead',T[lang].stAhead],ok:['ts-ok',T[lang].stOk]};
  const[cls,lbl]=map[st]||map.ok;
  return`<span class="tstatus ${cls}">${lbl}</span>`;
}
// ── List drag-and-drop helpers ────────────────────────────────────────
function collectSubtree(id){
  const r=[],t=tasks.find(x=>x.id===id);if(!t)return r;
  r.push(t);
  tasks.filter(x=>x.parentId===id).forEach(c=>r.push(...collectSubtree(c.id)));
  return r;
}
function canListDrop(src,tgt,pos){
  if(src.id===tgt.id)return false;
  const gids=new Set(collectSubtree(src.id).map(x=>x.id));
  if(gids.has(tgt.id))return false;
  if(src.type==='goal')return pos!=='into'&&tgt.parentId===null;
  if(src.type==='project'){
    if(pos==='into')return tgt.type==='goal';
    return tgt.type==='project'||tgt.type==='goal';
  }
  return pos!=='into'&&(tgt.type==='task'||tgt.type==='milestone');
}
function doListDrop(srcId,tgtId,pos){
  const src=tasks.find(t=>t.id===srcId),tgt=tasks.find(t=>t.id===tgtId);
  if(!src||!tgt)return;
  const grp=collectSubtree(srcId);
  const gids=new Set(grp.map(t=>t.id));
  tasks=tasks.filter(t=>!gids.has(t.id));
  let ti=tasks.findIndex(t=>t.id===tgtId);
  if(ti<0){tasks.push(...grp);render();saveData();return;}
  function isDescOf(taskId,ancId){
    let c=tasks.find(x=>x.id===taskId);
    while(c&&c.parentId){if(c.parentId===ancId)return true;c=tasks.find(x=>x.id===c.parentId);}
    return false;
  }
  if(pos==='above'){
    src.parentId=tgt.parentId;
    tasks.splice(ti,0,...grp);
  } else {
    src.parentId=pos==='into'?tgtId:tgt.parentId;
    let ins=ti+1;
    while(ins<tasks.length&&isDescOf(tasks[ins].id,tgtId))ins++;
    tasks.splice(ins,0,...grp);
  }
  listDrag=null;
  render();saveData();flash(T[lang].flashMoved);
}
function renderTaskList(){
  const{crit}=cpm();const rows=getVisibleRows();
  const el2=document.getElementById('tlist');el2.innerHTML='';
  rows.forEach(({task:t,level})=>{
    const isCrit=isLeaf(t)&&crit.has(t.id)&&showCP,st=status(t),isGoal=t.type==='goal',isProj=t.type==='project';
    let cls='trow';if(t.id===selId)cls+=' sel';if(isGoal)cls+=' goal';else if(isProj)cls+=' proj';else if(isCrit&&st==='ok')cls+=' cr';if(st==='warn')cls+=' wr';if(st==='over')cls+=' ov';
    const div=document.createElement('div');div.className=cls;const ind=level*18;
    if(isGoal){
      const isCol=collapsed.has(t.id);
      div.innerHTML=`<span style="width:${ind+2}px;flex-shrink:0"></span><button class="tog" onclick="event.stopPropagation();toggleCollapse(${t.id})">${isCol?'▶':'▼'}</button><span class="tn gname" style="color:#7c3aed" title="${t.name}">🎯 ${t.name}</span>${statusPill(st)}<span class="tacts"><button class="ibtn" title="新增子專案" onclick="event.stopPropagation();openAdd(${t.id},'project')" style="font-size:15px;font-weight:700">＋</button><button class="ibtn" onclick="event.stopPropagation();openEdit(${t.id})">✏</button><button class="ibtn del" onclick="event.stopPropagation();delTask(${t.id})">✕</button></span>`;
    } else if(isProj){
      const isCol=collapsed.has(t.id);
      div.innerHTML=`<span style="width:${ind+2}px;flex-shrink:0"></span><button class="tog" onclick="event.stopPropagation();toggleCollapse(${t.id})">${isCol?'▶':'▼'}</button><span class="tn pname" style="color:${t.color}" title="${t.name}">${t.name}</span>${t.assignee?`<span class="assignee">👤 ${t.assignee}</span>`:''} ${statusPill(st)}<span class="tacts"><button class="ibtn" title="新增子任務" onclick="event.stopPropagation();openAdd(${t.id},'task')" style="font-size:15px;font-weight:700">＋</button><button class="ibtn" onclick="event.stopPropagation();openEdit(${t.id})">✏</button><button class="ibtn del" onclick="event.stopPropagation();delTask(${t.id})">✕</button></span>`;
    } else {
      div.innerHTML=`<span style="width:${ind+20}px;flex-shrink:0"></span><span class="tn" title="${t.name}">${t.ms?'◆ ':''}${t.name}</span>${statusPill(st)}<span class="tacts"><button class="ibtn" onclick="event.stopPropagation();openEdit(${t.id})">✏</button><button class="ibtn del" onclick="event.stopPropagation();delTask(${t.id})">✕</button></span>`;
    }
    div.onclick=()=>{selId=t.id;renderTaskList();};div.ondblclick=()=>openEdit(t.id);
    // Drag-to-reorder
    div.draggable=true;
    div.addEventListener('dragstart',e=>{
      if(e.target.tagName==='BUTTON'){e.preventDefault();return;}
      listDrag={id:t.id};
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',t.id);
      setTimeout(()=>div.classList.add('dragging'),0);
    });
    div.addEventListener('dragend',()=>{
      listDrag=null;
      document.querySelectorAll('.trow').forEach(r=>r.classList.remove('dragging','drop-above','drop-below','drop-into'));
    });
    div.addEventListener('dragover',e=>{
      if(!listDrag||listDrag.id===t.id)return;
      const src=tasks.find(x=>x.id===listDrag.id);if(!src)return;
      const relY=(e.clientY-div.getBoundingClientRect().top)/div.getBoundingClientRect().height;
      const pos=t.type==='goal'&&relY>0.28&&relY<0.72?'into':relY<0.5?'above':'below';
      if(!canListDrop(src,t,pos))return;
      e.preventDefault();
      document.querySelectorAll('.trow').forEach(r=>r.classList.remove('drop-above','drop-below','drop-into'));
      div.classList.add(`drop-${pos}`);
    });
    div.addEventListener('dragleave',e=>{
      if(!div.contains(e.relatedTarget))div.classList.remove('drop-above','drop-below','drop-into');
    });
    div.addEventListener('drop',e=>{
      e.preventDefault();
      if(!listDrag||listDrag.id===t.id)return;
      const src=tasks.find(x=>x.id===listDrag.id);if(!src)return;
      const relY=(e.clientY-div.getBoundingClientRect().top)/div.getBoundingClientRect().height;
      const pos=t.type==='goal'&&relY>0.28&&relY<0.72?'into':relY<0.5?'above':'below';
      div.classList.remove('drop-above','drop-below','drop-into');
      if(canListDrop(src,t,pos))doListDrop(src.id,t.id,pos);
    });
    el2.appendChild(div);
  });
}

function getISOWeek(d){const dt=new Date(d.getTime());dt.setHours(0,0,0,0);dt.setDate(dt.getDate()+3-(dt.getDay()+6)%7);const w1=new Date(dt.getFullYear(),0,4);return{week:1+Math.round(((dt-w1)/86400000-3+(w1.getDay()+6)%7)/7),year:dt.getFullYear()};}
function deltaBadge(d){if(d===null||d===undefined)return'';if(d>0)return`<span style="color:#10b981;font-size:11px;font-weight:700;margin-left:5px">↑ +${d}%</span>`;if(d<0)return`<span style="color:#ef4444;font-size:11px;font-weight:700;margin-left:5px">↓ ${d}%</span>`;return`<span style="color:#94a3b8;font-size:11px;margin-left:5px">${T[lang].statFlat}</span>`;}
function takeWeekSnapshot(verbose=true){

  tasks.filter(t=>t.type==='project').forEach(p=>{weekSnapshot.projects[p.id]=getProjectProgress(p.id);});

}

      ${b?`<div style="font-size:11px;color:var(--text2);white-space:nowrap">${fmtD(b.start)} ～ ${fmtD(b.end)}</div>`:''}
    </div>`;
  });

  html+=`</div></div>`;

  // ── Workload section ──
  const workloadData=assignees.map(person=>{
    const ptasks=person.tasks;
    const totalWork=ptasks.reduce((s,t)=>s+t.dur,0);
    const doneWork=ptasks.reduce((s,t)=>s+t.dur*t.prog/100,0);
    const remainWork=totalWork-doneWork;
    return{...person,ptasks,totalWork,doneWork,remainWork};
  }).sort((a,b)=>b.remainWork-a.remainWork);

  html+=`<div style="margin-top:8px">
  <div class="stats-section-title">工作量</div>
  <div style="display:flex;flex-direction:column;gap:12px">`;

  workloadData.forEach(person=>{
    const{totalWork,doneWork,remainWork,ptasks}=person;
    const donePct=totalWork?doneWork/totalWork*100:0;
    const remainPct=totalWork?remainWork/totalWork*100:0;
    const ini=person.name.slice(0,1);
    const unfinished=ptasks.filter(t=>t.prog<100).map(t=>({
      t,remain:+(t.dur*(1-t.prog/100)).toFixed(1),st:status(t)
    })).sort((a,b)=>b.remain-a.remain);
    const dotCol={done:'#10b981',over:'#ef4444',warn:'#f59e0b',ahead:'#0d9488',ok:'#3b82f6'};
    html+=`<div class="workload-row">
      <div class="workload-header">
        <div class="avatar" style="background:${person.color};width:38px;height:38px;font-size:15px;flex-shrink:0">${ini}</div>
        <div class="workload-meta">
          <div class="workload-name">
            <span>${person.name}</span>
            <span style="font-size:12px;font-weight:400;color:var(--text2)">剩餘 <b style="color:${remainWork>0?'#f97316':'var(--success)'}">${remainWork.toFixed(1)}</b> 天 ／ 總計 ${totalWork} 天</span>
          </div>
          <div class="workload-bar-track">
            <div style="width:${donePct}%;background:#10b981;height:100%"></div>
            <div style="width:${remainPct}%;background:#f97316;height:100%"></div>
          </div>
        </div>
      </div>
      ${unfinished.length?`<div class="workload-chips">${unfinished.map(({t,remain,st})=>`<span class="wchip"><span style="width:8px;height:8px;border-radius:50%;background:${dotCol[st]||'#3b82f6'};flex-shrink:0;display:inline-block"></span>${t.name}<b style="color:var(--text2);margin-left:2px">≈${remain}d</b></span>`).join('')}</div>`:`<div style="font-size:12px;color:var(--success);margin-top:4px">${T[lang].allDone}</div>`}
    </div>`;
  });

  html+=`</div></div>`;

  document.getElementById('stats-content').innerHTML=html;
}

// ── Reminder log ─────────────────────────────────────────────────────
function formatReminderTime(iso){
  const d=new Date(iso),now=new Date(),ms=now-d;
  const hhmm=d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});
  const mmdd=`${d.getMonth()+1}/${d.getDate()}`;
  if(ms<60000)return`剛剛（${hhmm}）`;
  if(ms<3600000)return`${Math.floor(ms/60000)} 分鐘前（${hhmm}）`;
  if(ms<86400000)return`今日 ${hhmm}`;
  if(ms<172800000)return`昨日 ${hhmm}`;
  return`${mmdd} ${hhmm}`;
}
function recordReminder(name){
  reminderLog[name]=new Date().toISOString();
  saveData();
  setTimeout(()=>renderOverduePage(),60);
}

// ── Overdue page ─────────────────────────────────────────────────────
function renderOverduePage(){
  const overdueTasks=tasks.filter(isLeaf).filter(t=>status(t)==='over');

  // Group by assignee (via parent project)
  const groups={};
  overdueTasks.forEach(t=>{
    const proj=tasks.find(p=>p.id===t.parentId&&p.type==='project');
    const aName=proj?.assignee||T[lang].noAssignee;
    const member=team.find(m=>m.name===aName);
    const email=member?.email||'';
    if(!groups[aName])groups[aName]={name:aName,email,color:AVATAR_COLORS[Object.keys(groups).length%AVATAR_COLORS.length],items:[]};
    const end=addDays(parseD(t.start),t.dur);
    const daysLate=Math.abs(diff(tod(),end));
    groups[aName].items.push({task:t,proj,end,daysLate});
  });

  const list=Object.values(groups).sort((a,b)=>
    b.items.reduce((s,i)=>s+i.daysLate,0)-a.items.reduce((s,i)=>s+i.daysLate,0)
  );
  const total=overdueTasks.length;

  let html='';
  if(!total){
    html=`<div class="overdue-empty">${T[lang].overdueEmpty}</div>`;
  } else {
    html+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <div class="stats-section-title" style="margin-bottom:0;color:var(--critical)">${T[lang].overdueTitle(total,list.length)}</div>
    </div>`;
    list.forEach(g=>{
      const ini=g.name.slice(0,1);
      const totalLate=g.items.reduce((s,i)=>s+i.daysLate,0);
      // Build mailto
      const subject=encodeURIComponent(T[lang].emailSubject(g.items.length));
      const bodyLines=[
        T[lang].emailLine1(g.name),
        ``,
        T[lang].emailLine2,
        ``,
        ...g.items.map(({task:t,proj,end,daysLate})=>
          T[lang].emailItem(proj?.name,t.name,fmtD(end),daysLate,t.prog)
        ),
        ``,
        T[lang].emailQ1,
        T[lang].emailQ2,
        T[lang].emailQ3,
      ];
      const body=encodeURIComponent(bodyLines.join('\n'));
      const mailto=`mailto:${g.email}?subject=${subject}&body=${body}`;

      html+=`<div class="overdue-card">
        <div class="overdue-card-hdr">
          <div class="avatar" style="background:${g.color};width:42px;height:42px;font-size:17px;flex-shrink:0">${ini}</div>
          <div class="overdue-card-info">
            <div class="overdue-card-name">${g.name}</div>
            <div class="overdue-card-email">${g.email||T[lang].emailNone}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0">
            <a href="${mailto}" class="send-btn${reminderLog[g.name]&&(new Date()-new Date(reminderLog[g.name]))<86400000?' sent':''}" onclick="recordReminder(${JSON.stringify(g.name)})" ${!g.email?`style="opacity:.4;pointer-events:none"title="${T[lang].emailNoTitle}"`:''}>

              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              ${reminderLog[g.name]&&(new Date()-new Date(reminderLog[g.name]))<86400000?'再次發送':'發送提醒'}
            </a>
            ${reminderLog[g.name]?`<div style="font-size:11px;color:var(--text2)">✉ 上次提醒：${formatReminderTime(reminderLog[g.name])}</div>`:''}
          </div>
        </div>
        <div>`;

      g.items.sort((a,b)=>b.daysLate-a.daysLate).forEach(({task:t,proj,end,daysLate})=>{
        html+=`<div class="overdue-task-row">
          <span class="overdue-task-name">${proj?`<span style="color:${proj.color};font-size:11px;font-weight:700;margin-right:4px">[${proj.name}]</span>`:''}${t.name}</span>
          <span class="overdue-task-meta">${T[lang].origDate(fmtD(end))}</span>

      });

    });

// ── Scroll sync ───────────────────────────────────────────────────────
let syncing=false;
function initScroll(){
  const gs=document.getElementById('gbscroll'),ts=document.getElementById('tbscroll'),th=document.getElementById('thouter');
  gs.addEventListener('scroll',()=>{if(syncing)return;syncing=true;ts.scrollTop=gs.scrollTop;th.scrollLeft=gs.scrollLeft;syncing=false;});
  ts.addEventListener('scroll',()=>{if(syncing)return;syncing=true;gs.scrollTop=ts.scrollTop;syncing=false;});
}
function scrollToday(){const{mn}=dateRange();const px=PX[view];const x=toX(tod(),mn,px);const gs=document.getElementById('gbscroll');gs.scrollLeft=Math.max(0,x-gs.clientWidth/2);}

// ── Drag ──────────────────────────────────────────────────────────────
function getSVGCoords(e){const gs=document.getElementById('gbscroll');const r=gs.getBoundingClientRect();return{x:e.clientX-r.left+gs.scrollLeft,y:e.clientY-r.top+gs.scrollTop};}
function propagateDeps(){
  const leaves=tasks.filter(isLeaf);const vis=new Set(),ord=[];
  const visit=id=>{if(vis.has(id))return;vis.add(id);const t=tasks.find(x=>x.id===id);if(t&&isLeaf(t))t.deps.forEach(d=>{if(tasks.find(x=>x.id===d&&isLeaf(x)))visit(d);});if(t&&isLeaf(t))ord.push(id);};
  leaves.forEach(t=>visit(t.id));
  ord.forEach(id=>{const t=tasks.find(x=>x.id===id);if(!t||!isLeaf(t)||t.deps.length===0)return;let mx=null;t.deps.forEach(did=>{const dep=tasks.find(x=>x.id===did);if(!dep||!isLeaf(dep))return;const e=addDays(parseD(dep.start),dep.dur);if(!mx||e>mx)mx=e;});if(mx&&mx>parseD(t.start))t.start=fmtD(mx);});
}
function snapshotPositions(){return tasks.filter(isLeaf).map(t=>({id:t.id,start:t.start,dur:t.dur}));}
function restorePositions(snap){snap.forEach(o=>{const t=tasks.find(x=>x.id===o.id);if(t){t.start=o.start;t.dur=o.dur;}});}

function startMove(e,task){if(e.button!==0)return;e.preventDefault();e.stopPropagation();hideTT();const{mn}=dateRange();const px=PX[view];drag={type:'move',taskId:task.id,startX:e.clientX,origStart:task.start,origDur:task.dur,snap:snapshotPositions(),mn,px};document.body.classList.add('dragging');showHint(T[lang].hintMove(task.name));}
function startResize(e,task){if(e.button!==0)return;e.preventDefault();e.stopPropagation();hideTT();const{mn}=dateRange();const px=PX[view];drag={type:'resize',taskId:task.id,startX:e.clientX,origStart:task.start,origDur:task.dur,snap:snapshotPositions(),mn,px};document.body.classList.add('dragging');showHint(T[lang].hintResize(task.name));}
function startConnect(e,task,rowIdx){if(e.button!==0)return;e.preventDefault();e.stopPropagation();hideTT();const{mn}=dateRange();const px=PX[view];const fx=toX(addDays(parseD(task.start),task.dur),mn,px)+1,fy=rowIdx*RH+RH/2;drag={type:'connect',fromId:task.id,fromX:fx,fromY:fy,mn,px};document.body.classList.add('connecting');const svg=document.getElementById('gsvg');svg.appendChild(el('line',{id:'tmp-arr',x1:fx,y1:fy,x2:fx,y2:fy,stroke:'#3b82f6','stroke-width':'2.5','stroke-dasharray':'6,3','marker-end':'url(#arr-blue)',opacity:'0.85'}));showHint('拖至目標任務建立相依');}

document.addEventListener('mousemove',e=>{
  if(!drag)return;
  if(drag.type==='connect'){const c=getSVGCoords(e);const line=document.getElementById('tmp-arr');if(line){line.setAttribute('x2',c.x);line.setAttribute('y2',c.y);}return;}
  if(raf)cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{
    const task=tasks.find(t=>t.id===drag.taskId);if(!task)return;
    const dd=Math.round((e.clientX-drag.startX)/drag.px);
    restorePositions(drag.snap);
    if(drag.type==='move')task.start=fmtD(addDays(parseD(drag.origStart),dd));
    else task.dur=Math.max(1,drag.origDur+dd);
    propagateDeps();
    const{mn,mx}=dateRange();const W=diff(mn,mx)*drag.px+20;renderBody(mn,mx,drag.px,W);renderStatusBar();
  });
});

document.addEventListener('mouseup',e=>{
  if(!drag)return;hideHint();
  if(drag.type==='connect'){
    document.getElementById('tmp-arr')?.remove();
    const c=getSVGCoords(e);const rows=getVisibleRows();const idx=Math.floor(c.y/RH);
    const target=rows[idx]?.task;
    if(target&&isLeaf(target)&&target.id!==drag.fromId&&!target.deps.includes(drag.fromId)){if(!wouldCycle(target.id,drag.fromId))target.deps.push(drag.fromId);else flash(T[lang].flashCycle);}
    render();saveData();
  } else {renderTaskList();renderStatusBar();saveData();}
  drag=null;document.body.classList.remove('dragging','connecting');
});

function wouldCycle(targetId,fromId){const vis=new Set();function walk(id){if(vis.has(id))return false;vis.add(id);const t=tasks.find(x=>x.id===id);if(!t)return false;if(t.deps.includes(targetId))return true;return t.deps.some(walk);}return walk(fromId);}

  populateAssigneeSelect(t.assignee||'');
  setModalType(t.type==='goal'?'goal':t.ms?'milestone':t.type);pickColor(t.color);
  document.getElementById('fparent').value=t.parentId||'';
  if(isLeaf(t)){document.getElementById('fs').value=t.start;document.getElementById('fd').value=t.dur;document.getElementById('fe').value=fmtD(addDays(parseD(t.start),t.dur));document.getElementById('fp').value=t.prog;document.getElementById('pv').textContent=t.prog;document.getElementById('fdeps').value=t.deps.join(', ');}
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}
function saveTask(){
  const name=document.getElementById('fn').value.trim();if(!name){alert(T[lang].noName);return;}
  const id=document.getElementById('eid').value;
  const rawParent=document.getElementById('fparent').value;const parentId=rawParent?parseInt(rawParent):null;
  const color=document.querySelector('.csw.sel')?.dataset.c||COLORS[0];
  const assignee=document.getElementById('fassignee').value.trim();
  const isGoal=modalType==='goal';const isProject=modalType==='project';const isMilestone=modalType==='milestone';
  let start,dur,prog,deps,ms;
  if(!isProject&&!isGoal){start=document.getElementById('fs').value;dur=Math.max(1,parseInt(document.getElementById('fd').value)||1);prog=parseInt(document.getElementById('fp').value)||0;const raw=document.getElementById('fdeps').value.trim();deps=raw?raw.split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)&&n>0):[];ms=isMilestone;}
  else{start='';dur=0;prog=0;deps=[];ms=false;}
  const taskType=isGoal?'goal':isProject?'project':'task';
  const taskParentId=isGoal?null:parentId;
  if(id){const t=tasks.find(x=>x.id===parseInt(id));if(t)Object.assign(t,{name,parentId:taskParentId,type:taskType,color,assignee:isProject?assignee:(t.assignee||''),start,dur,prog,deps,ms});}
  else tasks.push({id:nid++,name,parentId:taskParentId,type:taskType,color,assignee:isProject?assignee:'',start,dur,prog,deps,ms,bl:null});
  closeModal();render();if(currentPage==='stats')renderStatsPage();saveData();
}
function delTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const children=getChildren(id);const desc=getLeafDescendants(id);
  const msg=T[lang].confirmDeleteTask(t.name,children.length);
  if(!confirm(msg))return;
  const del=new Set([id,...children.map(c=>c.id),...desc.map(d=>d.id)]);
  tasks=tasks.filter(t=>!del.has(t.id));tasks.forEach(t=>{t.deps=t.deps.filter(d=>!del.has(d));});
  if(del.has(selId))selId=null;render();saveData();
}

// ── Color picker ──────────────────────────────────────────────────────
function buildColorPicker(){
  const c=document.getElementById('cpick');
  COLORS.forEach(col=>{const d=document.createElement('div');d.className='csw';d.dataset.c=col;d.style.cssText=`width:26px;height:26px;border-radius:50%;background:${col};cursor:pointer;border:3px solid transparent;transition:all .15s;`;d.onclick=()=>pickColor(col);c.appendChild(d);});
}
function pickColor(col){document.querySelectorAll('.csw').forEach(s=>{s.style.borderColor=s.dataset.c===col?'#1e293b':'transparent';s.classList.toggle('sel',s.dataset.c===col);});}

// ── Misc ──────────────────────────────────────────────────────────────
function flash(msg){const d=document.createElement('div');d.textContent=msg;d.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:300;';document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function showHint(msg){const h=document.getElementById('drag-hint');h.textContent=msg;h.style.display='block';}
function hideHint(){document.getElementById('drag-hint').style.display='none';}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();if(drag){if(drag.snap)restorePositions(drag.snap);drag=null;document.body.classList.remove('dragging','connecting');document.getElementById('tmp-arr')?.remove();hideHint();render();}return;}
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key==='n'||e.key==='N')openAdd(null,'task');
  if(e.key==='p'||e.key==='P')openAdd(null,'project');
  if(e.key==='g'||e.key==='G')openAdd(null,'goal');
  if((e.key==='Delete'||e.key==='Backspace')&&selId)delTask(selId);
});

// ── Persistence ───────────────────────────────────────────────────────
const STORAGE_KEY='ganttpro-v1';
function saveData(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({tasks,team,nid,tmid,weekSnapshot,reminderLog}));}catch(e){}
}
function loadData(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return;
    const d=JSON.parse(raw);
    if(Array.isArray(d.tasks))tasks=d.tasks;
    if(Array.isArray(d.team))team=d.team;
    if(d.nid)nid=d.nid;
    if(d.tmid)tmid=d.tmid;
    if(d.weekSnapshot)weekSnapshot=d.weekSnapshot;
    if(d.reminderLog)reminderLog=d.reminderLog;
  }catch(e){}
}
function exportData(){
  const json=JSON.stringify({tasks,team,nid,tmid},null,2);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download=`ganttpro-${fmtD(tod())}.json`;
  a.click();
  flash(T[lang].flashBackup);
}
function importData(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!Array.isArray(d.tasks))throw new Error();
        tasks=d.tasks;team=d.team||[];nid=d.nid||tasks.reduce((m,t)=>Math.max(m,t.id),0)+1;tmid=d.tmid||team.reduce((m,t)=>Math.max(m,t.id),0)+1;
        saveData();render();flash(T[lang].flashImport);
      }catch(e){alert(T[lang].badFile);}
    };
    reader.readAsText(file);
  };
  input.click();
}

// ── Init ──────────────────────────────────────────────────────────────
loadData();if(!weekSnapshot)takeWeekSnapshot(false);buildColorPicker();initScroll();showPage('gantt');updateFilterDropdown();render();setTimeout(scrollToday,150);setLang('zh');
</script>
